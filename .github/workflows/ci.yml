name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      # Pinned to a commit, not a tag: a tag can be moved (OSS-17). This is the commit v4 pointed at on 2026-11-26.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Specs and tests agree
        run: scripts/check-specs.sh
      - name: Nothing private in the tree, workflows pinned
        run: scripts/check-public.sh --tree-only
