name: Bug report
description: Something in Who's Working does not work as described.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please leave out anything private: home-folder paths, prompts, file contents and session text. Write `~` for your home folder.

        A security problem goes to private reporting instead, as SECURITY.md says.
  - type: input
    id: app-version
    attributes:
      label: Who's Working version
      description: At the bottom of Settings, beside Quit Who's Working.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: Apple menu › About This Mac.
      placeholder: "macOS 26.1"
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and its version
      description: Claude Code, Codex, Cursor, OpenCode or Antigravity, and the version it reports.
      placeholder: "Codex CLI 0.171.0"
    validations:
      required: true
  - type: dropdown
    id: install-route
    attributes:
      label: How you installed Who's Working
      options:
        - The install command
        - The DMG
        - Built from source
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it again
      description: If you can make it happen again, the steps that do it.
      placeholder: |
        1. Start a Codex session
        2. Ask it to run a command
        3. The notch shows …
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots of the notch help. Check them for private text first.
